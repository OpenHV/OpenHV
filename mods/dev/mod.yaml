		Size: 10
		Ascender: 8
	TinyBold:
		Font: hv|bits/fonts/Inconsolata-Bold.ttf
		Size: 10
		Ascender: 8
	Small:
		Font: hv|bits/fonts/Inconsolata-Regular.ttf
		Size: 12
		Ascender: 9
	Regular:
		Font: hv|bits/fonts/Inconsolata-Regular.ttf
		Size: 14
		Ascender: 11
	Bold:
